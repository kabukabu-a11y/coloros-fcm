<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColorOS-FCM</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: sans-serif; background:#101216; color:#e8eaed; padding:16px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#9aa0a6; font-size:12px; margin-bottom:12px; }
  .chip { display:inline-block; font-size:11px; color:#9aa0a6; border:1px solid #3c4043; border-radius:99px; padding:1px 8px; margin-bottom:14px; }
  .row { display:flex; align-items:center; gap:10px; background:#1a1d23; border-radius:12px; padding:12px; margin-bottom:8px; }
  .dot { width:12px; height:12px; border-radius:50%; background:#5f6368; flex:none; }
  .ok { background:#34a853; } .bad { background:#ea4335; } .warn { background:#fbbc04; }
  .pkg { font-size:13px; word-break:break-all; }
  .meta { color:#9aa0a6; font-size:12px; }
  .sect { font-size:14px; font-weight:600; margin:18px 0 8px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .tag { display:inline-flex; align-items:center; gap:6px; background:#1a1d23; border:1px solid #3c4043; border-radius:99px; padding:5px 11px; font-size:13px; }
  .tag button { border:none; background:none; color:#9aa0a6; padding:0 2px; margin:0; font-size:15px; }
  .addrow { display:flex; gap:8px; }
  .addrow input { flex:1; background:#1a1d23; border:1px solid #3c4043; border-radius:10px; color:#e8eaed; padding:10px 12px; font-size:14px; min-width:0; }
  button { background:#2b2f36; color:#e8eaed; border:1px solid #3c4043; border-radius:10px; padding:10px 14px; font-size:14px; margin:0 8px 8px 0; }
  button:active { background:#3c4043; }
  button:disabled { opacity:.4; }
  #note { display:none; background:#2a2118; border:1px solid #7c5a10; border-radius:12px; padding:12px; font-size:13px; line-height:1.8; margin-bottom:12px; }
  #log { white-space:pre-wrap; font-size:12px; color:#c8ccd1; background:#0b0c0e; border-radius:12px; padding:12px; min-height:40px; }
</style>
</head>
<body>
<h1>ColorOS-FCM Guardian</h1>
<div class="sub">shell-only</div>
<span class="chip" id="chip">橋を検出中…</span>

<div id="note"></div>

<div class="row"><span class="dot" id="d-restric"></span><div><div>ColorOS GMS 制限 (google_restric_info)</div><div class="meta" id="m-restric">未取得</div></div></div>
<div class="row"><span class="dot" id="d-gcm"></span><div><div>GcmService</div><div class="meta" id="m-gcm">未取得</div></div></div>
<div id="targets"></div>

<div style="margin:14px 0 6px">
  <button id="btn-check">再チェック</button>
  <button id="btn-fix">一括修復</button>
</div>

<div class="sect">守護対象（通知を守りたいアプリ）</div>
<div class="tags" id="tagList"></div>
<div class="addrow">
  <input id="pkgInput" placeholder="パッケージ名（例: org.telegram.messenger）">
  <button id="btn-add">追加</button>
  <button id="btn-reset">リセット</button>
</div>
<div class="meta" style="margin:6px 0 14px">GMS は常時対象で外せません。登録したアプリは stopped 化・電池最適化から一緒に守られます。</div>

<pre id="log">起動中…</pre>

<script>
/* Bridge adaptation layer (same conventions as the Shizuku module
   ecosystem):
   sync : window.Shizuku.exec(cmd) / execWithOptions(cmd,optsJson)
          -> JSON string {exitCode, stdout, stderr}
          (Shizuku-Next / Shevery; no default cwd, absolute paths)
   async: window.ShizukuNext.exec(cmd) / execScript(relPath),
          output via onOutput/onError/onComplete callbacks
   dead : window.Shizuku exists but exposes no callable methods
          (manager release builds that stripped the bridge via R8)
*/
var BR = { kind:'none', mod:'', dead:false, blocked:false, info:null };
var $ = function(id){ return document.getElementById(id); };
var con = $('log');
function log(s){ con.textContent += (con.textContent ? '\n' : '') + s; }
function setLog(s){ con.textContent = s; }

function jkeys(o){
  var ks = [];
  try { Object.getOwnPropertyNames(o).forEach(function(k){ try { if (typeof o[k] === 'function') ks.push(k); } catch(e){} }); } catch(e){}
  return ks;
}

function detect(){
  var S = window.Shizuku, N = window.ShizukuNext, lines = [];
  if (S) {
    var sk = jkeys(S);
    lines.push('[diag] window.Shizuku keys=[' + sk.join(',') + ']');
    if (typeof S.exec === 'function' || typeof S.execWithOptions === 'function') {
      BR.kind = 'sync';
      if (typeof S.getModuleInfo === 'function') {
        try {
          var raw = S.getModuleInfo();
          var info = (typeof raw === 'string') ? JSON.parse(raw) : raw;
          if (info) {
            BR.info = info;
            BR.mod = (typeof info.moduleDir === 'string' && info.moduleDir) ? info.moduleDir
              : ((typeof info.webRoot === 'string' && info.webRoot) ? String(info.webRoot).replace(/\/webui\/?$/, '') : '');
            if (info.permissions && info.permissions.webBridge === false) BR.blocked = true;
            else if (/safe/i.test(String(info.accessMode || info.mode || ''))) BR.blocked = true;
          }
        } catch(e){ lines.push('[diag] getModuleInfo 解析失敗: ' + e); }
      }
    } else {
      BR.dead = true;
      lines.push('[diag] window.Shizuku はあるが呼べるメソッドが 0（管理器 release 版の橋剥離）');
    }
  } else {
    lines.push('[diag] window.Shizuku なし');
  }
  if (N && typeof N.exec === 'function' && BR.kind !== 'sync') {
    BR.kind = 'async';
    lines.push('[diag] window.ShizukuNext keys=[' + jkeys(N).join(',') + ']');
    if (typeof N.getModuleDir === 'function') { try { var d = N.getModuleDir(); if (d) BR.mod = d; } catch(e){} }
  }
  if (BR.mod) lines.push('[diag] moduleDir=' + BR.mod);
  return lines;
}

function syncRun(cmd, opt){
  return new Promise(function(res){
    try {
      var S = window.Shizuku, rj;
      if (opt && typeof S.execWithOptions === 'function') rj = S.execWithOptions(cmd, JSON.stringify(opt));
      else rj = S.exec(cmd);
      var r = (typeof rj === 'string') ? JSON.parse(rj) : rj;
      res(r && typeof r === 'object' ? r : { exitCode:-1, stdout:String(rj), stderr:'' });
    } catch(e){ res({ exitCode:-1, stdout:'', stderr:'bridge error: ' + e }); }
  });
}

var _q = Promise.resolve();
function asyncRun(invoke, live){
  return _q = _q.then(function(){
    return new Promise(function(res){
      var N = window.ShizukuNext, out = [], err = [], done = false, timer = null;
      var pO = N.onOutput, pE = N.onError, pC = N.onComplete;
      function restore(){ N.onOutput = pO || null; N.onError = pE || null; N.onComplete = pC || null; if (timer) clearTimeout(timer); }
      function fin(code){ if (done) return; done = true; restore(); res({ exitCode:code, stdout:out.join('\n'), stderr:err.join('\n') }); }
      N.onOutput = function(t, ty){ if (ty === 'stderr') err.push(t); else out.push(t); if (live) live(t, ty); if (pO) { try { pO(t, ty); } catch(e){} } };
      N.onError = function(m){ if (pE) { try { pE(m); } catch(e){} } if (!done) { done = true; restore(); res({ exitCode:-1, stdout:out.join('\n'), stderr:String(m) }); } };
      N.onComplete = function(c){ if (pC) { try { pC(c); } catch(e){} } fin(c); };
      try { invoke(); } catch(e){ fin(-1); }
      timer = setTimeout(function(){ if (!done) { err.push('300s timeout'); fin(-1); } }, 300000);
    });
  });
}

function runScript(rel, args){
  if (BR.kind === 'async') {
    var p = rel + (args ? ' ' + args : '');
    return asyncRun(function(){ window.ShizukuNext.execScript(p); });
  }
  if (BR.kind === 'sync') {
    if (!BR.mod) return Promise.resolve({ exitCode:-1, stdout:'', stderr:'moduleDir unknown' });
    return syncRun('sh "' + BR.mod + '/' + rel + '"' + (args ? ' ' + args : ''), null);
  }
  return Promise.resolve(null);
}

function refused(r){
  var s = String((r && r.stderr) || '') + ' ' + String((r && r.stdout) || '');
  return /no shell bridge/i.test(s);
}

function parseJson(out){
  var m = String(out || '').match(/JSON: (\{.*\})/);
  if (m) { try { return JSON.parse(m[1]); } catch(e){} }
  return null;
}

function setDot(id, cls, metaId, text){
  $(id).className = 'dot ' + cls;
  if (metaId) $(metaId).textContent = text;
}

function render(j){
  if (!j) return;
  setDot('d-restric', j.restric_info === '0' ? 'ok' : 'bad', 'm-restric',
    j.restric_info === '0' ? '0 = 制限オフ（正常）' : j.restric_info + ' = 制限あり');
  setDot('d-gcm', j.gcm_alive ? 'ok' : 'bad', 'm-gcm', j.gcm_alive ? '稼働中' : '応答なし');
  var html = '';
  (j.targets || []).forEach(function(t){
    var cls = t.stopped === 'missing' ? 'warn' : (t.stopped ? 'bad' : 'ok');
    var label = t.stopped === 'missing' ? '未インストール' : (t.stopped ? 'stopped=true' : 'stopped=false');
    var bl = {5:'exempted',10:'active',20:'working_set',30:'frequent',40:'rare',45:'never',50:'restricted'}[t.bucket] || ('不明(' + t.bucket + ')');
    html += '<div class="row"><span class="dot ' + cls + '"></span><div><div class="pkg">' +
      t.pkg + '</div><div class="meta">' + label + ' · Doze whitelist: ' +
      (t.whitelisted ? '登録済み' : '未登録') + ' · バケット: ' + bl + '</div></div></div>';
  });
  $('targets').innerHTML = html;
}

function xhrText(p){
  return new Promise(function(res, rej){
    try {
      var x = new XMLHttpRequest();
      x.open('GET', p, true);
      x.onload = function(){ if (x.status === 200 || x.status === 0) res(x.responseText); else rej(new Error('HTTP ' + x.status)); };
      x.onerror = function(){ rej(new Error('XHR error')); };
      x.send(null);
    } catch(e){ rej(e); }
  });
}

function loadReadonly(){
  xhrText('../state/last-check.json').then(function(t){
    try { render(JSON.parse(t)); log('✓ 保存済みのチェック結果を表示しました'); }
    catch(e){ log('⚠ last-check.json を解析できませんでした'); }
  }, function(){
    log('⚠ まだ state/last-check.json がありません。モジュールカードの Action を一度実行すると状態が保存されます');
  });
}

function busy(b){ $('btn-check').disabled = b; $('btn-fix').disabled = b; $('btn-add').disabled = b; $('btn-reset').disabled = b; }

/* ---- guardian target management (lib/targets.sh) ---- */
var GMS_PKG = 'com.google.android.gms';
function renderTags(list){
  var el = $('tagList'); el.innerHTML = '';
  list.forEach(function(p){
    var sp = document.createElement('span'); sp.className = 'tag';
    var tx = document.createElement('span'); tx.textContent = p + (p === GMS_PKG ? ' · 固定' : '');
    sp.appendChild(tx);
    if (p !== GMS_PKG && (BR.kind === 'sync' || BR.kind === 'async') && !BR.blocked) {
      var x = document.createElement('button'); x.textContent = '×';
      x.addEventListener('click', function(){ removeTarget(p); });
      sp.appendChild(x);
    }
    el.appendChild(sp);
  });
  if (!list.length) el.innerHTML = '<span class="meta">（取得できませんでした）</span>';
}
function refreshTargets(){
  if ((BR.kind === 'sync' || BR.kind === 'async') && !BR.blocked) {
    runScript('lib/targets.sh', 'list').then(function(r){
      if (!r) { renderTags([]); return; }
      var list = String(r.stdout || '').split('\n').map(function(s){ return s.trim(); })
        .filter(function(s){ return /^[A-Za-z0-9._]+$/.test(s); });
      renderTags(list);
    });
  } else {
    xhrText('../config/targets.txt').then(function(t){
      var list = String(t).split('\n').map(function(s){ return s.trim(); })
        .filter(function(s){ return s && s.charAt(0) !== '#'; });
      if (list.indexOf(GMS_PKG) < 0) list.unshift(GMS_PKG);
      renderTags(list);
    }, function(){ renderTags([GMS_PKG]); });
  }
}
function validPkg(p){ return /^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$/.test(p); }
function addTarget(){
  var p = $('pkgInput').value.trim();
  if (!validPkg(p)) { log('⚠ パッケージ名の形式が正しくありません: ' + p); return; }
  busy(true); log('▶ targets.sh add ' + p);
  runScript('lib/targets.sh', 'add ' + p).then(function(r){
    if (r && r.stdout) log(String(r.stdout).trim());
    if (r && refused(r) && !BR.blocked) enterBlocked();
    $('pkgInput').value = '';
    busy(false); refreshTargets();
  });
}
function removeTarget(p){
  busy(true); log('▶ targets.sh remove ' + p);
  runScript('lib/targets.sh', 'remove ' + p).then(function(r){
    if (r && r.stdout) log(String(r.stdout).trim());
    busy(false); refreshTargets();
  });
}
function resetTargets(){
  busy(true); log('▶ targets.sh reset');
  runScript('lib/targets.sh', 'reset').then(function(r){
    if (r && r.stdout) log(String(r.stdout).trim());
    busy(false); refreshTargets();
  });
}
$('btn-add').addEventListener('click', addTarget);
$('btn-reset').addEventListener('click', resetTargets);

function showResult(r){
  if (!r) return null;
  if (refused(r) && !BR.blocked) enterBlocked();
  var out = String(r.stdout || ''), es = String(r.stderr || '');
  if (out) log(out);
  if (es) log('⚠ stderr:\n' + es);
  if (!out && !es) log('(exit ' + r.exitCode + ')');
  var j = parseJson(out);
  if (j) render(j);
  return j;
}

function enterBlocked(){
  BR.blocked = true;
  $('chip').textContent = 'Safe · Full access が必要';
  var n = $('note');
  n.style.display = 'block';
  n.innerHTML = 'コマンドが管理器に拒否されました（Safe モード）。<br>モジュール一覧 → ColorOS-FCM の設定 → <b>Access mode = Full access</b> に変更し、<b>Allow background actions</b> もオンにしてから、このページに戻ってください。';
  busy(true);
  loadReadonly();
  refreshTargets();
}

function doCheck(){
  busy(true); log('▶ check.sh 実行中…');
  runScript('lib/check.sh').then(function(r){ showResult(r); busy(false); });
}
function doFix(){
  busy(true); log('▶ fix.sh 実行中…');
  runScript('lib/fix.sh').then(function(r){
    showResult(r);
    log('▶ 修復後チェック…');
    return runScript('lib/check.sh');
  }).then(function(r){ showResult(r); busy(false); });
}

$('btn-check').addEventListener('click', doCheck);
$('btn-fix').addEventListener('click', doFix);

/* ---- startup ---- */
setLog('');
detect().forEach(log);
if (BR.kind === 'sync') {
  $('chip').textContent = '橋: Shizuku (sync)' + (BR.info && (BR.info.accessMode || BR.info.mode) ? ' · ' + (BR.info.accessMode || BR.info.mode) : '');
  if (BR.blocked) enterBlocked(); else { doCheck(); refreshTargets(); }
} else if (BR.kind === 'async') {
  $('chip').textContent = '橋: ShizukuNext (async)';
  doCheck(); refreshTargets();
} else {
  $('chip').textContent = BR.dead ? '只読 · 橋が使えません' : '只読 · 橋なし';
  var n = $('note');
  n.style.display = 'block';
  n.innerHTML = BR.dead
    ? 'この管理器の release 版では WebUI の橋メソッドが剥離されていて、<b>どのモジュールの WebUI からもコマンドを実行できません</b>（モジュール側の問題ではありません）。<b>Shizuku-Next を v14.0.32 以上に更新</b>すると直る場合があります。それまではモジュールカードの <b>Action</b> ボタンで診断・修復を実行してください（自動守護 service.sh は影響を受けません）。下には保存済みの状態を表示します。'
    : 'この管理器では WebUI からシェルを実行できません。モジュールカードの <b>Action</b> ボタンで診断・修復を実行してください。下には保存済みの状態を表示します。';
  busy(true);
  loadReadonly();
  refreshTargets();
}
</script>
</body>
</html>
